name: doc_viewer_app
description: Florence Documentation Viewer - A markdown documentation viewer with theme support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # File Operations
  file_picker: ^6.1.1

  # Markdown Rendering
  flutter_markdown: ^0.6.18
  markdown: ^7.1.1

  # Syntax Highlighting
  flutter_highlight: ^0.7.0

  # Fonts
  google_fonts: ^6.1.0

  cupertino_icons: any

  # Storage
  shared_preferences: ^2.2.2

  # URL Launcher
  url_launcher: ^6.2.2

  # WebView for Mermaid Rendering
  webview_flutter: ^4.4.2

  # Package Info
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true



  assets:
    - assets/images/
